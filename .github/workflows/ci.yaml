# This file is generated from .github/build_matrix.exs by
# script/generate_ci.exs. Do not edit it by hand: edit the matrix and run
#
#     elixir script/generate_ci.exs
name: Elixir package CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  schedule:
    - cron: 0 0 * * 1-5

jobs:
  validate-changesets:
    uses: ./.github/workflows/validate_changesets.yaml

  lint_git:
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'schedule' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: lintje/action@v0.11

  lint_ci:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate the CI workflow
        run: elixir script/generate_ci.exs
      - name: Check the CI workflow is up to date
        run: git diff --exit-code .github/workflows/ci.yaml

  lint_format:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check code formatting
        run: mix format --check-formatted

  lint_credo:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get dependencies
        run: mix deps.get
      - name: Analyze code with Credo
        run: mix credo --strict

  lint_dialyzer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        set:
          - ""
          - all
    env:
      MIX_ENV: test
      _APPSIGNAL_TEST_DEPS: ${{matrix.set}}
    steps:
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - name: PLT cache
        uses: actions/cache@v4
        id: plt_cache
        with:
          key: plt-${{matrix.set}}
          path: priv/plts
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get dependencies
        run: mix deps.get
      - name: Compile
        run: mix compile
      - name: Analyze code with Dialyzer
        run: mix dialyzer --format github

  test_diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.3
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Get dependencies
        run: mix deps.get
      - name: Run tests
        run: LANGUAGE=elixir test/integration/diagnose/bin/test

  test_no_nif:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
