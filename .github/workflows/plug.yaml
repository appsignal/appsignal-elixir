name: Elixir Plug integration CI

on:
  push:
    branches:
    - "main"
    - develop
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
  schedule:
    - cron: "0 0 * * 1-5"

jobs:
  lint_compile:
    runs-on: ubuntu-latest
    env:
      _APPSIGNAL_TEST_DEPS: plug
    steps:
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get dependencies
        run: mix deps.get
      - name: Check for compilation errors
        run: MIX_ENV=test mix compile --warnings-as-errors

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elixir:
          - "1.19.5"
        otp:
          - "28"
          - "27"
          - "26"
        include:
          - elixir: "main"
            otp: "28"
          - elixir: "latest"
            otp: "28"
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.15"
            otp: "26"

    env:
      _APPSIGNAL_TEST_DEPS: plug
    steps:
      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get dependencies
        run: mix deps.get
      - name: Run tests
        run: mix test
